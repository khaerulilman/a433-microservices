apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karsajobs-backend
  template:
    metadata:
      labels:
        app: karsajobs-backend
    spec:
      containers:
        - name: backend
          image: khaerulilman/karsajobs:latest
          ports:
            - containerPort: 3000
          env:
            - name: APP_PORT
              value: "8080"
            - name: MONGO_HOST
              value: mongo-service:27017
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://mongo-service:27017/karsajobs
